<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#060b16" />
<title>50 Michael Jacksons VS 10 Medieval Soldiers</title>
<style>
  :root{--glass:rgba(5,9,20,.80);--mj:#67e8f0;--kn:#ff6b6b;--gold:#ffd166}
  *{box-sizing:border-box}
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#060b16;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  canvas{display:block;position:fixed;inset:0;touch-action:none}
  #ui{position:fixed;inset:0;z-index:5;pointer-events:none}
  #title{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;text-align:center;font-weight:950;font-size:clamp(18px,4.6vw,34px);line-height:1.05;text-shadow:0 4px 18px rgba(0,0,0,.95)}
  #title span{display:block;margin-top:5px;font-size:clamp(10px,2.4vw,14px);font-weight:700;opacity:.78}
  #status{position:absolute;top:max(78px,calc(env(safe-area-inset-top) + 64px));left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--glass);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:850;backdrop-filter:blur(10px)}
  #start{pointer-events:auto;position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);min-width:210px;border:0;border-radius:16px;padding:18px 24px;background:linear-gradient(180deg,#ffe17b,#f2bd2e);color:#171005;font-size:20px;font-weight:1000;box-shadow:0 16px 55px rgba(0,0,0,.58);touch-action:manipulation}
  #start:active{transform:translate(-50%,-48%) scale(.98)}
  #controls{position:absolute;right:10px;top:max(112px,calc(env(safe-area-inset-top) + 98px));display:flex;gap:6px;pointer-events:auto}
  #controls button{border:1px solid rgba(255,255,255,.14);background:var(--glass);color:#fff;border-radius:10px;padding:8px 10px;font-weight:850;backdrop-filter:blur(10px)}
  #scores{position:absolute;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .card{background:var(--glass);border:1px solid rgba(255,255,255,.13);border-radius:15px;padding:10px 12px;backdrop-filter:blur(10px);min-width:0}
  .card.right{text-align:right}
  .label{font-size:10px;font-weight:950;letter-spacing:.08em;opacity:.76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:clamp(24px,7vw,44px);font-weight:1000;line-height:1.05;font-variant-numeric:tabular-nums}
  .mj .count{color:var(--mj)} .kn .count{color:var(--kn)}
  .bar{height:8px;margin-top:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .fill{height:100%;transition:width .18s linear}.mj .fill{background:linear-gradient(90deg,#27bfd0,#8ff8ff)}.kn .fill{background:linear-gradient(90deg,#ffabab,#ff4747);margin-left:auto}
  #winner{display:none;position:absolute;left:12px;right:12px;top:41%;transform:translateY(-50%);text-align:center;font-size:clamp(30px,8vw,64px);font-weight:1000;text-shadow:0 6px 30px #000}
  #error{display:none;position:absolute;left:18px;right:18px;top:44%;transform:translateY(-50%);background:rgba(40,5,10,.94);border:1px solid rgba(255,255,255,.15);border-radius:15px;padding:18px;text-align:center;font-weight:800;line-height:1.45}
  @media (max-height:600px){#title{font-size:18px}#title span{display:none}#status{top:52px}#controls{top:84px}.count{font-size:24px}}
</style>
</head>
<body>
<div id="ui">
  <div id="title">50 Michael Jacksons VS 10 Medieval Soldiers! ⚔️<span>Who will win? Tap Start Battle.</span></div>
  <div id="status">Loading 3D battlefield…</div>
  <button id="start" hidden>START BATTLE</button>
  <div id="controls"><button id="pause">Pause</button><button id="restart">Restart</button></div>
  <div id="winner"></div>
  <div id="error"></div>
  <div id="scores">
    <div class="card mj"><div class="label">MICHAEL JACKSON ARMY</div><div id="mjCount" class="count">50</div><div class="bar"><div id="mjBar" class="fill" style="width:100%"></div></div></div>
    <div class="card kn right"><div class="label">MEDIEVAL ARMY</div><div id="knCount" class="count">10</div><div class="bar"><div id="knBar" class="fill" style="width:100%"></div></div></div>
  </div>
</div>
<script type="module">
const statusEl=document.getElementById('status');
const startBtn=document.getElementById('start');
const pauseBtn=document.getElementById('pause');
const restartBtn=document.getElementById('restart');
const winnerEl=document.getElementById('winner');
const errorEl=document.getElementById('error');
const mjCountEl=document.getElementById('mjCount');
const knCountEl=document.getElementById('knCount');
const mjBar=document.getElementById('mjBar');
const knBar=document.getElementById('knBar');

try {
  const THREE = await import('https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js');
  const {OrbitControls} = await import('https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/controls/OrbitControls.js');

  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x07111f);
  scene.fog=new THREE.FogExp2(0x07111f,.007);

  const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,500);
  camera.position.set(0,44,72);

  const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  document.body.prepend(renderer.domElement);

  const controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;
  controls.dampingFactor=.07;
  controls.target.set(0,4,0);
  controls.minDistance=28;
  controls.maxDistance=130;
  controls.maxPolarAngle=Math.PI*.48;

  scene.add(new THREE.HemisphereLight(0xbfe7ff,0x28351c,2.1));
  const sun=new THREE.DirectionalLight(0xffefd1,3.4);
  sun.position.set(-35,62,30);
  sun.castShadow=true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-65; sun.shadow.camera.right=65; sun.shadow.camera.top=65; sun.shadow.camera.bottom=-65;
  scene.add(sun);

  const ground=new THREE.Mesh(new THREE.PlaneGeometry(170,118,1,1),new THREE.MeshStandardMaterial({color:0x3b592c,roughness:1}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
  const centre=new THREE.Mesh(new THREE.PlaneGeometry(.75,105),new THREE.MeshBasicMaterial({color:0xf2cf5b,transparent:true,opacity:.38}));
  centre.rotation.x=-Math.PI/2;centre.position.y=.025;scene.add(centre);

  for(const z of [-45,45]){
    for(const x of [-48,-24,0,24,48]){
      const post=new THREE.Mesh(new THREE.CylinderGeometry(.09,.13,4,8),new THREE.MeshStandardMaterial({color:0x4b3321,roughness:1}));
      post.position.set(x,2,z);post.castShadow=true;scene.add(post);
      const flame=new THREE.Mesh(new THREE.SphereGeometry(.22,10,8),new THREE.MeshBasicMaterial({color:0xffad33}));
      flame.position.set(x,4.1,z);scene.add(flame);
      const light=new THREE.PointLight(0xff9b35,1.3,11,2);light.position.copy(flame.position);scene.add(light);
    }
  }

  const mats={
    black:new THREE.MeshStandardMaterial({color:0x111216,roughness:.55,metalness:.08}),
    white:new THREE.MeshStandardMaterial({color:0xf1f3f5,roughness:.42,metalness:.12}),
    silver:new THREE.MeshStandardMaterial({color:0xb3bcc4,roughness:.25,metalness:.8}),
    red:new THREE.MeshStandardMaterial({color:0x9e2530,roughness:.58,metalness:.12}),
    skin:new THREE.MeshStandardMaterial({color:0xd5a079,roughness:.72}),
    gold:new THREE.MeshStandardMaterial({color:0xe7b83f,roughness:.28,metalness:.68}),
    leather:new THREE.MeshStandardMaterial({color:0x4a2e20,roughness:.85}),
    cyan:new THREE.MeshStandardMaterial({color:0x53e7ef,emissive:0x0d6268,emissiveIntensity:1.05,roughness:.3})
  };

  function shadow(mesh){mesh.castShadow=true;mesh.receiveShadow=true;return mesh}
  function makeMJ(){
    const g=new THREE.Group();
    const torso=shadow(new THREE.Mesh(new THREE.BoxGeometry(1.18,2.0,.68),mats.white));torso.position.y=2.62;g.add(torso);
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(.13,1.82,.71),mats.silver);stripe.position.set(.37,2.65,0);g.add(stripe);
    const belt=new THREE.Mesh(new THREE.BoxGeometry(1.23,.16,.73),mats.black);belt.position.y=1.7;g.add(belt);
    const head=shadow(new THREE.Mesh(new THREE.SphereGeometry(.46,18,14),mats.skin));head.position.y=4.1;g.add(head);
    const hair=new THREE.Mesh(new THREE.SphereGeometry(.50,16,12,0,Math.PI*2,0,Math.PI*.58),mats.black);hair.position.set(0,4.31,-.05);g.add(hair);
    const hatTop=new THREE.Mesh(new THREE.CylinderGeometry(.45,.56,.3,20),mats.black);hatTop.position.y=4.72;g.add(hatTop);
    const brim=new THREE.Mesh(new THREE.CylinderGeometry(.77,.77,.07,22),mats.black);brim.position.y=4.57;g.add(brim);
    for(const side of [-1,1]){
      const arm=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,1.72,10),mats.black));arm.position.set(side*.71,2.57,0);arm.rotation.z=side*-.14;arm.name=side<0?'armL':'armR';g.add(arm);
      const glove=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),side>0?mats.white:mats.black);glove.position.set(side*.82,1.76,0);g.add(glove);
      const leg=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,1.92,10),mats.black));leg.position.set(side*.23,.88,0);leg.name=side<0?'legL':'legR';g.add(leg);
      const shoe=shadow(new THREE.Mesh(new THREE.BoxGeometry(.35,.18,.65),mats.white));shoe.position.set(side*.23,.05,.16);g.add(shoe);
    }
    const aura=new THREE.PointLight(0x4fe5ef,.8,6,2);aura.position.y=2.6;g.add(aura);
    g.scale.setScalar(.82);return g;
  }

  function makeKnight(){
    const g=new THREE.Group();
    const torso=shadow(new THREE.Mesh(new THREE.BoxGeometry(1.30,2.1,.78),mats.red));torso.position.y=2.62;g.add(torso);
    const plate=shadow(new THREE.Mesh(new THREE.BoxGeometry(1.00,1.58,.83),mats.silver));plate.position.y=2.75;g.add(plate);
    const head=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.52,.58,.82,12),mats.silver));head.position.y=4.14;g.add(head);
    const slit=new THREE.Mesh(new THREE.BoxGeometry(.72,.10,.60),mats.black);slit.position.set(0,4.17,-.26);g.add(slit);
    const plume=new THREE.Mesh(new THREE.BoxGeometry(.11,.65,.38),mats.red);plume.position.y=4.87;g.add(plume);
    const shield=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.13,8),mats.gold));shield.rotation.z=Math.PI/2;shield.position.set(-.86,2.62,.02);g.add(shield);
    const sword=shadow(new THREE.Mesh(new THREE.BoxGeometry(.10,2.1,.10),mats.silver));sword.position.set(.94,2.97,0);sword.rotation.z=-.34;sword.name='sword';g.add(sword);
    const hilt=new THREE.Mesh(new THREE.BoxGeometry(.42,.09,.12),mats.gold);hilt.position.set(.61,2.01,0);hilt.rotation.z=-.34;g.add(hilt);
    for(const side of [-1,1]){
      const leg=shadow(new THREE.Mesh(new THREE.CylinderGeometry(.16,.20,1.88,10),mats.black));leg.position.set(side*.24,.87,0);leg.name=side<0?'legL':'legR';g.add(leg);
    }
    g.scale.setScalar(.88);return g;
  }

  const mjUnits=[],knUnits=[],projectiles=[],particles=[];
  const mjGroup=new THREE.Group(),knGroup=new THREE.Group();scene.add(mjGroup,knGroup);
  let running=false,paused=false,finished=false,sim=0,mjAlive=50,knAlive=10;

  function spawn(){
    mjGroup.clear();knGroup.clear();mjUnits.length=0;knUnits.length=0;
    for(let i=0;i<50;i++){
      const u=makeMJ();const col=i%10,row=Math.floor(i/10);
      u.position.set(-15.5-row*1.85+(Math.random()-.5)*.25,0,(col-4.5)*2.6+(Math.random()-.5)*.3);
      u.rotation.y=Math.PI/2;u.userData={alive:true,cooldown:.25+Math.random()*1.1,phase:Math.random()*Math.PI*2};
      mjGroup.add(u);mjUnits.push(u);
    }
    for(let i=0;i<10;i++){
      const u=makeKnight();const col=i%5,row=Math.floor(i/5);
      u.position.set(15.5+row*2.1+(Math.random()-.5)*.2,0,(col-2)*4.3+(Math.random()-.5)*.3);
      u.rotation.y=-Math.PI/2;u.userData={alive:true,cooldown:.4+Math.random()*1.1,phase:Math.random()*Math.PI*2};
      knGroup.add(u);knUnits.push(u);
    }
  }

  function nearest(from,list){let best=null,bestD=Infinity;for(const t of list){if(!t.userData.alive)continue;const d=from.position.distanceToSquared(t.position);if(d<bestD){best=t;bestD=d}}return [best,Math.sqrt(bestD)]}
  function burst(pos,color,n=10){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.08,7,6),new THREE.MeshBasicMaterial({color}));m.position.copy(pos);m.userData={life:.6,vel:new THREE.Vector3((Math.random()-.5)*5,1.5+Math.random()*4,(Math.random()-.5)*5)};scene.add(m);particles.push(m)}}
  function kill(unit,faction){if(!unit.userData.alive)return;unit.userData.alive=false;unit.visible=false;burst(unit.position.clone().add(new THREE.Vector3(0,2.2,0)),faction==='mj'?0x62eff7:0xff6262,12);if(faction==='mj')mjAlive--;else knAlive--;updateHUD()}
  function fire(attacker,target){const p=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),mats.cyan);p.position.copy(attacker.position).add(new THREE.Vector3(0,2.4,0));p.userData={target,speed:18};scene.add(p);projectiles.push(p)}
  function animateCharacter(u,t,isMJ,dt){
    const dist=u.position.distanceTo(t.position);u.userData.cooldown-=dt;
    const bob=Math.sin(sim*7+u.userData.phase)*.075;u.position.y=bob;
    const legL=u.getObjectByName('legL'),legR=u.getObjectByName('legR');if(legL&&legR){const swing=Math.sin(sim*8+u.userData.phase)*.20;legL.rotation.z=swing;legR.rotation.z=-swing}
    if(dist>(isMJ?6.5:1.75)){
      const dir=t.position.clone().sub(u.position);dir.y=0;dir.normalize();u.position.addScaledVector(dir,dt*(isMJ?4.25:3.2));
    }else if(u.userData.cooldown<=0){
      if(isMJ){fire(u,t);u.userData.cooldown=.55+Math.random()*.7;const arm=u.getObjectByName('armR');if(arm)arm.rotation.z=-1.0}
      else{const sword=u.getObjectByName('sword');if(sword)sword.rotation.z=-1.05;if(Math.random()<.48)kill(t,'mj');u.userData.cooldown=.8+Math.random()*.7}
    }
  }
  function update(dt){
    const ma=mjUnits.filter(u=>u.userData.alive),ka=knUnits.filter(u=>u.userData.alive);
    for(const u of ma){const [t]=nearest(u,ka);if(t)animateCharacter(u,t,true,dt)}
    for(const u of ka){const [t]=nearest(u,ma);if(t)animateCharacter(u,t,false,dt)}
    for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i],t=p.userData.target;if(!t||!t.userData.alive){scene.remove(p);projectiles.splice(i,1);continue}const dest=t.position.clone().add(new THREE.Vector3(0,2.1,0));const v=dest.sub(p.position),d=v.length();if(d<.38){if(Math.random()<.56)kill(t,'kn');scene.remove(p);projectiles.splice(i,1)}else p.position.addScaledVector(v.normalize(),dt*p.userData.speed)}
    for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.userData.life-=dt;p.userData.vel.y-=dt*9;p.position.addScaledVector(p.userData.vel,dt);p.scale.setScalar(Math.max(.05,p.userData.life));if(p.userData.life<=0){scene.remove(p);particles.splice(i,1)}}
    if(!finished&&(mjAlive<=0||knAlive<=0)){finished=true;running=false;winnerEl.textContent=knAlive<=0?'🕺 MICHAEL JACKSON ARMY WINS!':'⚔️ MEDIEVAL ARMY WINS!';winnerEl.style.display='block';statusEl.textContent='Battle complete'}
  }

  function updateHUD(){mjCountEl.textContent=mjAlive;knCountEl.textContent=knAlive;mjBar.style.width=(mjAlive/50*100)+'%';knBar.style.width=(knAlive/10*100)+'%'}
  function reset(){for(const p of [...projectiles,...particles])scene.remove(p);projectiles.length=0;particles.length=0;mjAlive=50;knAlive=10;running=false;paused=false;finished=false;sim=0;winnerEl.style.display='none';startBtn.hidden=false;startBtn.textContent='START BATTLE';pauseBtn.textContent='Pause';statusEl.textContent='Ready — tap Start Battle';spawn();updateHUD();renderer.render(scene,camera)}
  function start(){if(running)return;startBtn.hidden=true;running=true;paused=false;statusEl.textContent='Battle running — armies advancing';clock.getDelta()}

  startBtn.addEventListener('click',start);
  pauseBtn.addEventListener('click',()=>{if(!running&&!paused)return;paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';statusEl.textContent=paused?'Battle paused':'Battle running'});
  restartBtn.addEventListener('click',reset);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

  const clock=new THREE.Clock();
  function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.045);if(running&&!paused&&!finished){sim+=dt;update(dt)}controls.update();renderer.render(scene,camera)}
  reset();frame();
} catch (err) {
  console.error(err);
  statusEl.style.display='none';
  errorEl.style.display='block';
  errorEl.textContent='The 3D engine could not load. Check that Safari has an internet connection, then reload this page. Details: '+(err?.message||err);
}
</script>
</body>
</html>
